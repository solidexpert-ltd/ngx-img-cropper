name: Publish to npm

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Set publish version
        run: |
          ANGULAR_MAJOR=$(node -p "const p=require('./package.json'); const raw=(p.devDependencies&&p.devDependencies['@angular/core'])||(p.peerDependencies&&p.peerDependencies['@angular/core'])||(p.dependencies&&p.dependencies['@angular/core']); if(!raw) throw new Error('missing @angular/core'); String(raw).replace(/^[^0-9]*/,'').split('.')[0]")
          NEW_VERSION="${ANGULAR_MAJOR}.0.${{ github.run_number }}"
          export NEW_VERSION
          node -e "const fs=require('fs'); const path=require('path'); const version=process.env.NEW_VERSION; for (const file of ['projects/ngx-img-cropper/package.json']) { const pkgPath=path.resolve(file); const pkg=require(pkgPath); pkg.version=version; fs.writeFileSync(pkgPath, JSON.stringify(pkg,null,2)+'\n'); console.log(file+' -> '+pkg.version); }"
      - run: npm run build
      - name: Publish to npm
        working-directory: dist/ngx-img-cropper
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag latest
